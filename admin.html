<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="images/server_logo.png" type="image/png">
  <link rel="apple-touch-icon" href="images/server_logo.png">

  <title>新井鯖 - Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
    }
    .site-nav {
      position: sticky;
      font-family: 'Noto Sans JP', sans-serif;
      top: 0;
      z-index: 500;
    }
    .site-nav::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.97);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid #334155;
      z-index: -1;
    }
    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 2rem;
    }
    .nav-logo-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: #f1f5f9;
    }
    .nav-logo {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: cover;
    }
    .nav-title {
      font-size: 1.2rem;
      font-weight: 900;
      color: #38bdf8;
      letter-spacing: 0.02em;
    }
    .nav-links {
      list-style: none;
      display: flex;
      gap: 0.25rem;
    }
    .nav-links a {
      display: block;
      padding: 0.5rem 1rem;
      color: #cbd5e1;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .nav-links a:hover {
      background: #1e293b;
      color: #38bdf8;
      border-color: #334155;
    }
    .nav-links a.active {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem 0;
    }
    header {
      text-align: center;
      margin-bottom: 3rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #334155;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      color: #f1f5f9;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 1rem;
    }
    .admin-section {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
    }
    .member-card {
      background: linear-gradient(155deg, #16213a 0%, #0f172a 65%);
      padding: 1.25rem;
      border-radius: 14px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.5s ease, transform 0.5s ease, border-color 0.25s, box-shadow 0.25s, background 0.25s;
    }
    .member-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, #38bdf8, rgba(56, 189, 248, 0));
      opacity: 0.6;
      transition: opacity 0.25s, width 0.25s;
    }
    .member-card:hover {
      border-color: #38bdf8;
      background: linear-gradient(155deg, rgba(56, 189, 248, 0.08) 0%, #0f172a 65%);
      box-shadow: 0 10px 28px rgba(56, 189, 248, 0.12);
      transform: translateY(-3px);
    }
    .member-card:hover::before {
      opacity: 1;
      width: 4px;
    }
    .member-card.fade-in:hover {
      transform: translateY(-3px);
    }
    .member-card.active {
      border-color: #38bdf8;
      box-shadow: 0 10px 28px rgba(56, 189, 248, 0.15);
    }
    .member-main {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 100%;
    }
    .member-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid #334155;
      object-fit: cover;
      background: #1e293b;
      flex-shrink: 0;
      transition: border-color 0.25s;
    }
    .member-card:hover .member-avatar,
    .member-card.active .member-avatar {
      border-color: #38bdf8;
    }
    .member-info {
      min-width: 0;
    }
    .member-info .role {
      display: inline-block;
      font-size: 0.7rem;
      color: #38bdf8;
      font-weight: 700;
      letter-spacing: 0.03em;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 0.1rem 0.55rem;
      border-radius: 999px;
      margin-bottom: 0.35rem;
    }
    .member-info .name {
      color: #f1f5f9;
      font-size: 1.05rem;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    .member-card-chevron {
      margin-left: auto;
      color: #64748b;
      width: 1.1rem;
      height: 1.1rem;
      flex-shrink: 0;
      transition: transform 0.3s ease, color 0.25s;
    }
    .member-card.active .member-card-chevron {
      transform: rotate(180deg);
      color: #38bdf8;
    }
    .member-profile {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out, padding 0.3s ease, margin 0.3s ease;
      font-size: 0.875rem;
      color: #94a3b8;
      line-height: 1.6;
      border-top: 0 solid #334155;
      margin-top: 0;
    }
    .member-card.active .member-profile {
      max-height: 200px;
      padding-top: 0.75rem;
      margin-top: 0.5rem;
      border-top-width: 1px;
    }
    .profile-text {
      white-space: pre-wrap;
    }
    .server-owner {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 2rem;
      border-radius: 16px;
      margin-bottom: 2.5rem;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .server-owner::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #38bdf8;
    }
    .server-owner:hover {
      border-color: #38bdf8;
      box-shadow: 0 8px 32px rgba(56, 189, 248, 0.1);
    }
    .owner-main {
      display: flex;
      align-items: center;
      gap: 2rem;
    }
    .character-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 2px solid #38bdf8;
      object-fit: cover;
      background: #0f172a;
    }
    .owner-info .role {
      font-size: 0.875rem;
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .owner-info .name {
      font-size: 1.75rem;
      color: #f1f5f9;
      font-weight: 700;
    }
    .owner-profile {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out, padding 0.3s ease;
      font-size: 1rem;
      color: #cbd5e1;
      line-height: 1.7;
    }
    .server-owner.active .owner-profile {
      max-height: 300px;
      padding-top: 1.5rem;
      margin-top: 1.5rem;
      border-top: 1px solid #334155;
    }
    .department {
      margin-bottom: 3rem;
    }
    .dept-header {
      border-left: 4px solid #38bdf8;
      padding: 0.5rem 1.25rem;
      margin-bottom: 1.5rem;
    }
    .dept-title {
      font-size: 1.5rem;
      color: #f1f5f9;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .dept-desc {
      font-size: 0.9rem;
      color: #94a3b8;
    }
    .members-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
    }
    footer {
      text-align: center;
      padding: 2.5rem 2rem 2rem;
      color: #475569;
      font-size: 0.8rem;
      border-top: 1px solid #1e293b;
      margin-top: 4rem;
    }
    .footer-social {
      display: flex;
      justify-content: center;
      gap: 1.25rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .footer-social a {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.45rem 1rem;
      border-radius: 20px;
      border: 1px solid #334155;
      transition: all 0.3s ease;
    }
    .footer-social a:hover {
      color: #f1f5f9;
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
    }
    .footer-social img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      transform: scale(1.05);
    }
    .footer-social a[href*="x.com"] img {
      transform: scale(0.88);
    }
    footer p {
      margin-bottom: 0.25rem;
    }
    .nav-hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
    }
    .nav-hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background: #f1f5f9;
      border-radius: 2px;
    }
    .nav-hamburger span {
        transition: all 0.3s ease;
    }
    .nav-hamburger.open span:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
    }
    .nav-hamburger.open span:nth-child(2) {
        opacity: 0;
        transform: scaleX(0);
    }
    .nav-hamburger.open span:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
    }
    .nav-badge {
        display: inline-block;
        background: #ef4444;
        color: #fff;
        font-size: 0.6rem;
        font-weight: 700;
        padding: 0.1rem 0.35rem;
        border-radius: 999px;
        margin-left: 0.3rem;
        vertical-align: middle;
        line-height: 1.4;
    }
    #back-to-top {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        width: 44px;
        height: 44px;
        background: rgba(56, 189, 248, 0.15);
        border: 1px solid rgba(56, 189, 248, 0.4);
        border-radius: 50%;
        color: #38bdf8;
        font-size: 1.2rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s, transform 0.3s, background 0.2s;
        z-index: 150;
    }
    #back-to-top.visible {
        opacity: 1;
        pointer-events: auto;
    }
    #back-to-top:hover {
        background: rgba(56, 189, 248, 0.3);
        transform: translateY(-3px);
    }
    .back-to-top-icon {
        width: 1.25rem;
        height: 1.25rem;
        stroke-width: 2;
        color: #38bdf8;
    }
    .member-card.fade-in {
        opacity: 1;
        transform: translateY(0);
    }
    .server-owner.fade-in {
        opacity: 1;
        transform: translateY(0);
    }
    .member-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.25rem;
      margin-left: 0.25rem;
    }
    .member-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: #38bdf8;
      text-decoration: none;
      border: 1px solid rgba(56, 189, 248, 0.3);
      background: rgba(56, 189, 248, 0.08);
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      transition: background 0.2s, border-color 0.2s;
    }
    .member-link:hover {
      background: rgba(56, 189, 248, 0.18);
      border-color: #38bdf8;
    }
    .member-link i {
      width: 0.9rem;
      height: 0.9rem;
      color: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-icon {
      display: none;
      width: 1.1rem;
      height: 1.1rem;
      flex-shrink: 0;
    }
    @media (max-width: 768px) {
        .container { padding: 2rem 1rem 0; }
        h1 { font-size: 2rem; }
        .owner-main { flex-direction: column; text-align: center; gap: 1.5rem; }
        .members-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .nav-inner { padding: 0.75rem 1rem; position: relative; }
      .nav-hamburger { display: flex; }
      .nav-links {
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0;
        right: 0;
        height: 100dvh;
        width: 260px;
        max-width: 82vw;
        background: rgba(15, 23, 42, 0.98);
        border-left: 1px solid #334155;
        padding: 5rem 1.25rem 2rem;
        z-index: 300;
        transform: translateX(110%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        gap: 0.4rem;
        box-shadow: -8px 0 32px rgba(0, 0, 0, 0.5);
        overflow-y: auto;
      }
      .nav-links.open {
        transform: translateX(0);
      }
      .nav-links a {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.9rem 1.25rem;
        font-size: 1rem;
        border-radius: 8px;
      }
      .nav-icon {
        display: block;
      }
    }
    .nav-title-pc {
        display: none;
    }
    @media (min-width: 641px) {
        .nav-title-pc {
            display: inline;
        }
    }
    .nav-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 200;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    .nav-overlay.open {
      display: block;
    }
    .nav-hamburger {
      position: relative;
      z-index: 400;
    }
  </style>
</head>

        avatar: 'images/marusuke_icon.png',
        alt: 'まるすけ',
        profile: '他鯖での執行本部・企画部の経験を活かし、新井鯖のシステムの提案及び管理を担当している。',
      },
      'mochi': {
        role: '部員',
        name: 'もち',
        avatar: 'images/kinakomochi_icon.png',
        alt: 'もち',
        profile: '新井鯖の治安維持及び新規メンバーの受け入れを担当している。新井鯖の治安維持に欠かせない存在。',
      }
    };

    const adminPageData = {
      owner: { personId: 'arai-guma' },
      departments: [
        {
          id: 'legal',
          title: '法務部門',
          description: 'サーバー内の問題解決や総合運営',
          members: [
            { personId: 'arai-guma', role: '裁判官' }
          ]
        },
        {
          id: 'tech',
          title: '技術部門',
          description: 'サーバーの技術部分の作成および更新',
          members: [
            { personId: 'koko' },
            { personId: 'mogukoro' }
          ]
        },
        {
          id: 'personnel',
          title: '総合人事部門',
          description: 'サーバー内のマップの管理',
          members: [
            { personId: 'koishi', role: '部長' },
            { personId: 'shina', role: '部員' }
          ]
        },
        {
          id: 'general',
          title: '総合部門',
          description: 'イベントの運営や雑務',
          members: [
            { personId: 'yakitori' },
            { personId: 'koishi', role: '部員' },
            { personId: 'shina', role: '部員' }
          ]
        },
        {
          id: 'expansion-management',
          title: '拡大管理部門',
          description: '新規メンバーの受け入れやサーバーの拡大管理',
          members: [
            { personId: 't-nyan' },
            { personId: 'marusuke' },
            { personId: 'mochi' }
          ]
        }
      ]
    };

    function resolveMember(entry) {
      const base = peopleRegistry[entry.personId] || {};
      return Object.assign({}, base, entry, { role: entry.role || base.role });
    }

    function renderAdminPage() {
      const container = document.getElementById('admin-content');
      if (!container) return;

      const owner = resolveMember(adminPageData.owner);
      const ownerMarkup = `
        <div class="server-owner" onclick="toggleProfile(this)" id="owner-${adminPageData.owner.personId}">
          <div class="owner-main">
            <img src="${owner.avatar}" alt="${owner.alt}" class="character-img">
            <div class="owner-info">
              <p class="role">${owner.role}</p>
              <p class="name">${owner.name}</p>
            </div>
          </div>
          <div class="owner-profile">
            <p class="profile-text">${owner.profile}</p>
          </div>
        </div>
      `;

      const departmentsMarkup = adminPageData.departments.map((department) => `
        <section class="department" data-department-id="${department.id}">
          <div class="dept-header">
            <h2 class="dept-title">${department.title}</h2>
            <p class="dept-desc">${department.description}</p>
          </div>
          <div class="members-grid">
            ${department.members.map((entry, idx) => {
              const member = resolveMember(entry);
              const domId = `${department.id}-${entry.personId}-${idx}`;
              return `
              <div class="member-card" onclick="toggleProfile(this)" id="${domId}">
                <div class="member-main">
                  <img src="${member.avatar}" alt="${member.alt}" class="member-avatar">
                  <div class="member-info">
                    <p class="role">${member.role}</p>
                    <p class="name">${member.name}</p>
                  </div>
                  <i data-lucide="chevron-down" class="member-card-chevron"></i>
                </div>
                ${member.links && member.links.length ? `
                  <div class="member-actions">
                    ${member.links.map((link) => `
                      <a href="${link.href}" target="_blank" rel="noopener noreferrer" class="member-link" onclick="event.stopPropagation()">
                        <img src="${link.icon}" alt="${link.label}" style="width: 1.2rem; height: 1.2rem;"> ${link.label}
                      </a>
                    `).join('')}
                  </div>
                ` : ''}
                <div class="member-profile">
                  <p class="profile-text">${member.profile}</p>
                </div>
              </div>
            `;
            }).join('')}
          </div>
        </section>
      `).join('');

      container.innerHTML = `${ownerMarkup}${departmentsMarkup}`;
    }

    function toggleNav() {
      const nav = document.querySelector('.nav-links');
      const hamburger = document.querySelector('.nav-hamburger');
      const overlay = document.getElementById('navOverlay');
      if (!nav || !hamburger || !overlay) return;
      nav.classList.toggle('open');
      hamburger.classList.toggle('open');
      overlay.classList.toggle('open');
      document.body.style.overflow = nav.classList.contains('open') ? 'hidden' : '';
    }

    function toggleProfile(element) {
      element.classList.toggle('active');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.querySelector('.nav-links').classList.contains('open')) {
        toggleNav();
      }
    });

    (function () {
        const lastVisit  = Number(localStorage.getItem("araiserver_newsLastVisit") || 0);
        const latestDate = localStorage.getItem("araiserver_newsLatest");
        if (!latestDate) return;
        const hasUnread  = new Date(latestDate).getTime() > lastVisit;
        if (hasUnread) {
            const link = document.querySelector('a[href="news.html"]');
            if (link) link.insertAdjacentHTML("beforeend", '<span class="nav-badge">NEW</span>');
        }
    })();
    const backToTop = document.getElementById('back-to-top');
    window.addEventListener('scroll', () => {
        backToTop.classList.toggle('visible', window.scrollY > 300);
    });
    backToTop.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    function initFadeInAnimation() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    setTimeout(() => {
                        entry.target.classList.add('fade-in');
                    }, index * 120);
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.member-card, .server-owner').forEach(el => {
            observer.observe(el);
        });
    }

    renderAdminPage();
    document.addEventListener('DOMContentLoaded', initFadeInAnimation);
    lucide.createIcons();
  </script>
</body>
</html>
